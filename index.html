<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUSTAKA BANKSAM DIGITAL</title>
    <style>
        /* Menghilangkan margin/padding bawaan browser */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah double scrollbar */
            background-color: #f4f6f9;
        }

        /* Membuat iframe mengisi seluruh halaman */
        .app-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Masukkan Web App URL dari Google Apps Script di sini -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbyJLbFHdNvMKb0yRFOiq-EWgW1cJo75eu8CGkRVeTnhV2_iIsR3hOKffnM0aIde39o/exec" 
        width="100%" 
        height="100%" 
        style="border: none; min-height: 100vh;"
        allow="fullscreen; camera; microphone; clipboard-write"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
    </iframe>

</body>
</html>
